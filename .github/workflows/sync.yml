name: garmin-sync

on:
  schedule:
    - cron: "30 9 * * *" # 09:30 UTC daily, after the watch syncs
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [scheduled, manual, backfill, dry_run]
        default: manual
      days:
        description: "Days to fetch, ending today (backfill always uses 365)"
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements.txt

      - name: Run sync
        env:
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          DAYS: ${{ github.event_name == 'schedule' && '3' || inputs.days }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/sync.py
